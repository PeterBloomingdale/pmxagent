# docker-compose.yml

# Define explicit network for service communication
networks:
  pmxnet:
    driver: bridge

services:
  rapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.rapi
    container_name: pmxagent-rapi
    platform: linux/amd64
    ports:
      - "5762:8000"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check - just verify port is listening (OpenAPI fetch is too slow)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/__docs__/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Volume for figure output and data files
    volumes:
      - ./figures:/figures
      - ./data:/data

    # Restart policy
    restart: unless-stopped

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - pmxnet

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    container_name: pmxagent-mcp
    platform: linux/amd64
    ports:
      - "8000:8000"

    # Resource limits (lighter than rapi)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Environment variables
    environment:
      RAPI_OPENAPI_URL: http://rapi:8000/openapi.json
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "INFO"
      MCP_BASE_URL: http://localhost:8000
      MCP_TEST_TOKEN: "pmxagent-ci-token"
      # Escape hatch. The server serves MCP 2026-07-28 only and refuses handshake-era
      # clients with JSON-RPC -32022. Set to "true" to re-admit them if a client
      # cannot yet negotiate the modern protocol - takes a restart, not a rebuild.
      MCP_ALLOW_LEGACY: "false"
      # No outbound pypi.org call on every container start.
      FASTMCP_CHECK_FOR_UPDATES: "off"
      # ASCII banner is noise in container logs.
      FASTMCP_SHOW_SERVER_BANNER: "false"
      # FASTMCP_TELEMETRY_MODE is intentionally left at its default ("native"):
      # it is OpenTelemetry API instrumentation only, a no-op unless an OTel SDK
      # and exporter are configured, and it implements the 2026-07-28 spec's
      # trace-context propagation through request _meta. Nothing is sent off-box.

    # Note: health check added once the server went stateless - see Dockerfile.mcp.
    # server/discover needs no session, so a single POST is a valid liveness probe.

    # Service dependency
    depends_on:
      rapi:
        condition: service_healthy

    # Restart policy
    restart: unless-stopped

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - pmxnet
